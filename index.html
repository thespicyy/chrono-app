<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<!-- `viewport-fit=cover` : sur un téléphone à encoche tenu à l'horizontale,
     l'entaille mange le bord gauche ou droit. On prend l'écran entier et on
     rend la marge nécessaire en CSS, plutôt que de laisser deux bandes noires. -->
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#000000"/>
<!-- iOS ignore le manifeste pour le mode plein écran : ces deux balises sont le
     seul moyen d'obtenir une application sans barre de navigateur une fois
     ajoutée à l'écran d'accueil. -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Chrono</title>
<link rel="manifest" href="manifest.webmanifest?v=41"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=41"/>
<link rel="icon" type="image/png" href="icon-192.png?v=41"/>
<link rel="stylesheet" href="flip.css?v=41"/>
<link rel="stylesheet" href="chrono.css?v=41"/>
<link rel="stylesheet" href="suivi.css?v=41"/>
<link rel="stylesheet" href="tableau.css?v=41"/>
</head>
<body>

<!-- Toute la page est la surface de commande : sur un appareil posé sur un
     bureau, viser un bouton de quelques millimètres est une contrainte inutile.
     Une tape n'importe où démarre ou met en pause. -->
<main class="scene" id="scene">
  <div class="flip">
    <div class="flip-cartes" id="flip-cartes"></div>
  </div>
</main>

<!-- Durées du minuteur. Des durées toutes prêtes plutôt que des boutons « + »
     et « − » : sur un appareil posé à un mètre, régler 25 minutes une minute à
     la fois n'est pas une interaction, c'est une corvée. Visible uniquement en
     mode minuteur, et seulement à l'arrêt. -->
<nav class="durees" id="durees" hidden aria-label="Durée du minuteur"></nav>

<!-- Les commandes s'effacent quand le chrono tourne et qu'on n'y touche plus :
     un chronomètre de bureau se regarde, il ne se pilote pas en permanence. -->
<!-- Les commandes s'effacent quand il n'y a plus rien à décider — pendant un
     décompte, ou devant l'horloge. Elles disparaissent alors **complètement**,
     et cessent de recevoir les taps : un bouton invisible qu'on peut presser
     par mégarde est pire qu'un bouton absent. La première tape les rappelle,
     sans rien déclencher d'autre. -->
<footer class="barre" id="barre">
  <button class="cmd" id="reset" aria-label="Remettre à zéro">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
  <button class="cmd cmd-principal" id="startpause" aria-label="Démarrer ou mettre en pause">
    <svg viewBox="0 0 24 24" id="icone" aria-hidden="true">
      <path id="icone-forme" d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/>
    </svg>
  </button>
</footer>

<!-- Les trois coins. Chacun porte une seule fonction, toujours au même endroit :
     on les atteint au pouce sans regarder, ce qui est le but sur un appareil
     posé. Le bouton « plein écran » a disparu — l'application installée s'ouvre
     déjà ainsi, il ne servait qu'à annuler ce qu'elle fait toute seule. Le
     raccourci clavier F reste, pour l'usage au navigateur. -->
<button class="coin coin-bg" id="mode" aria-label="Changer de mode">
  <svg viewBox="0 0 24 24" id="icone-mode" aria-hidden="true">
    <path id="icone-mode-forme" d="M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/>
  </svg>
</button>

<button class="coin coin-hd" id="synchro" aria-label="Synchronisation">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 12a8 8 0 0 1-13.7 5.7M4 12a8 8 0 0 1 13.7-5.7"/>
    <path d="M17.7 2.7v3.6h-3.6M6.3 21.3v-3.6h3.6"/>
  </svg>
</button>

<button class="coin coin-bd" id="progression" aria-label="Voir mes statistiques">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
  </svg>
</button>

<!-- Fin de session : la seule question posée, et elle ne se pose qu'une fois le
     temps déjà écoulé. Deux tapes au total — la catégorie, puis rien. -->
<div class="voile" id="voile-fin" hidden>
  <div class="panneau">
    <p class="panneau-titre">Tu viens de travailler</p>
    <p class="panneau-duree" id="fin-duree">0 min</p>
    <p class="panneau-question">Sur quoi ?</p>
    <div class="choix sans-barre" id="fin-choix"></div>

    <!-- Créer une catégorie sans quitter la question. Sans cela, une session
         portant sur un sujet nouveau ne laissait que deux issues : la ranger
         dans une catégorie qui ne lui convient pas, ou la jeter. -->
    <div class="saisie" id="fin-saisie" hidden>
      <input type="text" id="fin-nouvelle" maxlength="40"
             placeholder="Nom de la catégorie"/>
      <button class="bouton" id="fin-creer" type="button">Créer</button>
    </div>
    <div class="panneau-pied">
      <button class="lien" id="fin-ignorer" type="button">Ne pas compter</button>
    </div>
  </div>
</div>

<!-- Progression : totaux, niveaux, série, et la gestion des catégories. -->
<div class="voile" id="voile-progression" hidden>
  <div class="panneau panneau-large">
    <div class="panneau-entete">
      <p class="panneau-titre" id="prog-titre">Progression</p>
      <button class="lien" id="prog-fermer" type="button">Fermer</button>
    </div>
    <div class="prog-corps sans-barre" id="prog-corps"></div>
    <div class="panneau-pied panneau-pied-large">
      <button class="lien" id="prog-categories" type="button">Catégories</button>
      <button class="lien" id="prog-synchro" type="button">Synchronisation</button>
    </div>
  </div>
</div>

<!-- Corriger une catégorie : l'historique de ses entrées, chacune retirable.
     Le bandeau d'annulation ne défait que le dernier geste ; une erreur
     s'aperçoit parfois le lendemain, ou après trois autres tapes. Ouvert par un
     appui long sur une tuile. -->
<div class="voile" id="voile-corriger" hidden>
  <div class="panneau">
    <div class="panneau-entete">
      <p class="panneau-titre" id="corr-titre">Corriger</p>
      <button class="lien" id="corr-fermer" type="button">Fermer</button>
    </div>
    <div class="prog-corps sans-barre" id="corr-corps"></div>
  </div>
</div>

<!-- L'heure en petit, pendant qu'on chronomètre ou qu'on décompte. Elle ne
     s'efface pas avec les commandes : c'est une information, pas un bouton, et
     la voir d'un coup d'œil est précisément ce qu'on lui demande. -->
<div class="heure-coin" id="heure-coin" hidden></div>

<!-- Signature de branding, comme en pied des autres applications NOIR. -->
<img class="marque" src="brand.png?v=41" alt="NOIR">

<!-- La face PORTRAIT : le tableau de progression. L'orientation choisit la
     face, et ce n'est pas un artifice — elle dit la posture. À l'horizontale,
     l'appareil est posé et se regarde ; à la verticale, il est en main et se
     tape. En paysage, tout ce bloc est retiré de la mise en page, pas
     seulement masqué : un bouton invisible qu'on presse par mégarde est pire
     qu'un bouton absent. -->
<section class="tableau" id="tableau">
  <!-- Le bouton des réglages est dans le balisage, hors de la zone redessinée :
       un bouton reconstruit à chaque rendu perdrait son écouteur, ou en
       gagnerait un de plus à chaque fois. -->
  <header class="tab-tete">
    <div class="tab-tete-vue" id="tab-tete-vue"></div>
    <button class="tab-reglages" id="tab-reglages" type="button"
            aria-label="Progression et réglages">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
      </svg>
    </button>
  </header>

  <div class="tab-grille sans-barre" id="tab-grille"></div>

  <!-- Créer une catégorie sans quitter le tableau, avec son unité : c'est
       l'unité qui décide du geste, elle ne peut pas se choisir après coup. -->
  <div class="tab-neuve" id="tab-neuve" hidden>
    <input type="text" id="tab-neuve-nom" maxlength="40"
           placeholder="Muscu, vélo, lecture…"/>
    <!-- Le rythme visé, plutôt que le coût d'un niveau. « Combien d'heures
         vaut un niveau » n'a pas de réponse — personne ne raisonne ainsi.
         « Combien de fois par semaine je vise » en a une, et le coût s'en
         déduit : quatre semaines de rythme tenu valent un niveau. -->
    <div class="rythme rythme-neuve">
      <span class="rythme-nom">Rythme visé</span>
      <input type="number" id="tab-neuve-rythme" class="rythme-champ"
             min="0" inputmode="decimal"/>
      <span class="rythme-suffixe" id="tab-neuve-suffixe"></span>
      <span class="rythme-resume" id="tab-neuve-resume"></span>
    </div>
    <div class="tab-neuve-pied">
      <div class="unites" id="tab-neuve-unites"></div>
      <button class="lien" id="tab-neuve-fermer" type="button">Annuler</button>
      <button class="bouton" id="tab-neuve-creer" type="button">Créer</button>
    </div>
  </div>

  <!-- L'annulation d'un `+1`, offerte quelques secondes. Demander confirmation
       à chaque tape coûterait cher à chaque fois pour éviter une erreur rare ;
       laisser revenir dessus ne coûte rien tant qu'on ne s'est pas trompé. -->
  <div class="tab-annuler" id="tab-annuler" hidden>
    <span id="tab-annuler-texte"></span>
    <button id="tab-annuler-bouton" type="button">Annuler</button>
  </div>
</section>

<script src="timer.js?v=41"></script>
<script src="suivi.js?v=41"></script>
<script src="suivi-ui.js?v=41"></script>
<script src="tableau.js?v=41"></script>
<script src="chrono.js?v=41"></script>
</body>
</html>
